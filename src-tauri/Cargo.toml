[package]
name = "arp"
version = "0.1.0"
edition = "2021"
description = "Minimal desktop wrapper for 7movies.ac"

[lib]
name = "arp_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
